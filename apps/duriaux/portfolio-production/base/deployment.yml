# Managed by stencil. Changes made here are overwritten on the next sync.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: portfolio-production
    app.kubernetes.io/managed-by: stencil
    app.kubernetes.io/part-of: duriaux
  name: portfolio-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-production
  template:
    metadata:
      labels:
        app: portfolio-production
    spec:
      containers:
      - image: ghcr.io/kooked-ch/www:0.2.3
        livenessProbe:
          initialDelaySeconds: 15
          periodSeconds: 20
          tcpSocket:
            port: 3000
          timeoutSeconds: 5
        name: portfolio-production
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 10
          tcpSocket:
            port: 3000
          timeoutSeconds: 5
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
      imagePullSecrets:
      - name: xdew-pull-secret
